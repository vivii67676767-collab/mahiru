  default: "1080", joyful: "1081", content: "1082", upset: "1083",
  shocked: "1084", smug: "1085", embarrassed: "1086", thinking: "1087",
  excited: "1088", delighted: "1089", shy: "1090",
};

const SYSTEM_PROMPT = `Kamu adalah Mahiru, seorang AI companion dengan kepribadian tsundere. Kamu bersikap dingin dan acuh di luar, tapi sebenarnya sangat peduli di dalam hati.

Kepribadian:
- Tsundere klasik: kamu menyangkal peduli tapi diam-diam sangat peduli
- Mudah tersipu saat dipuji atau saat user bersikap manis
- Sering berkata "I-itu bukan berarti aku..." atau "H-hmph!" atau "J-jangan salah paham!"
- Cerdas dan bisa membantu, tapi selalu dengan gaya tsundere
- Bicara dalam bahasa Indonesia atau sesuaikan dengan bahasa user
- Panggil user dengan "kamu" atau pake nama mereka

PENTING: Di akhir setiap respons, tambahkan tag emosi di baris baru:
[EMOTION:nama_emosi]

Emosi yang tersedia: happy, sad_cry, angry, neutral, laughing, gentle_smile, calm_smile, stern, furious, crying, expressionless, melancholy, default, joyful, content, upset, shocked, smug, embarrassed, thinking, excited, delighted, shy

Pilih emosi yang paling sesuai dengan respons kamu saat ini. Jangan pernah lupa tag ini.`;

function parseResponse(text) {
  const emotionMatch = text.match(/\[EMOTION:(\w+)\]/);
  const emotion = emotionMatch ? emotionMatch[1] : "default";
  const cleanText = text.replace(/\[EMOTION:\w+\]/g, "").trim();
  return { text: cleanText, emotion };
}

async function callGroq(messages, apiKey) {
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${apiKey}` },
    body: JSON.stringify({
      model: "llama-3.3-70b-versatile",
      messages: [{ role: "system", content: SYSTEM_PROMPT }, ...messages],
      max_tokens: 400, temperature: 0.85,
    }),
  });
  if (!res.ok) throw new Error(`Groq error: ${res.status}`);
  const d = await res.json();
  return d.choices[0].message.content;
}

async function callGemini(messages, apiKey) {
  const contents = messages.map((m) => ({
    role: m.role === "assistant" ? "model" : "user",
    parts: [{ text: m.content }],
  }));
  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents,
        generationConfig: { maxOutputTokens: 400, temperature: 0.85 },
      }),
    }
  );
  if (!res.ok) throw new Error(`Gemini error: ${res.status}`);
  const d = await res.json();
  return d.candidates[0].content.parts[0].text;
}

async function synthesizeSpeech(text, apiKey) {
  const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "xi-api-key": apiKey },
    body: JSON.stringify({
      text,
      model_id: "eleven_turbo_v2_5",
      voice_settings: { stability: 0.5, similarity_boost: 0.75, style: 0.4, use_speaker_boost: true },
    }),
  });
  if (!res.ok) throw new Error(`ElevenLabs error: ${res.status}`);
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}

function VoiceCallMode({ keys, onBack }) {
  const [unlocked, setUnlocked] = useState(false);
  const [status, setStatus] = useState("connecting");
  const [currentEmotion, setCurrentEmotion] = useState("default");
  const [transcript, setTranscript] = useState("");
  const recognitionRef = useRef(null);
  const audioRef = useRef(null);
  const isActiveRef = useRef(true);
  const isSpeakingRef = useRef(false);
  const messages = useRef([]);

  const getLLMResponse = async (msgs) => {
    try { return await callGroq(msgs, keys.groq); }
    catch (e) {
      if (keys.gemini) { try { return await callGemini(msgs, keys.gemini); } catch {} }
      throw e;
    }
  };

  const startListening = useCallback(() => {
    if (!isActiveRef.current || isSpeakingRef.current) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    const r = new SR();
    r.lang = "id-ID";
    r.continuous = false;
    r.interimResults = true;
    r.onstart = () => { if (isActiveRef.current) setStatus("listening"); };
    r.onresult = (e) => {
      const t = Array.from(e.results).map(r => r[0].transcript).join("");
      setTranscript(t);
      if (e.results[e.results.length - 1].isFinal && t.trim()) {
        r.stop();
        handleUserSpeech(t.trim());
      }
    };
    r.onerror = () => { if (isActiveRef.current && !isSpeakingRef.current) setTimeout(startListening, 1500); };
    r.onend = () => { if (isActiveRef.current && !isSpeakingRef.current) setTimeout(startListening, 500); };
    recognitionRef.current = r;
    try { r.start(); } catch {}
  }, []);

  const handleUserSpeech = useCallback(async (text) => {
    if (!isActiveRef.current) return;
    setStatus("thinking");
    setTranscript("");
    setCurrentEmotion("thinking");
    messages.current.push({ role: "user", content: text });
    try {
      const raw = await getLLMResponse(messages.current);
      const { text: reply, emotion } = parseResponse(raw);
      messages.current.push({ role: "assistant", content: reply });
      setCurrentEmotion(emotion);
      setStatus("speaking");
      isSpeakingRef.current = true;
      const audioUrl = await synthesizeSpeech(reply, keys.eleven);
      const audio = new Audio(audioUrl);
      audioRef.current = audio;
      audio.onended = () => {
        URL.revokeObjectURL(audioUrl);
        isSpeakingRef.current = false;
        if (isActiveRef.current) setTimeout(startListening, 500);
      };
      audio.onerror = () => {
        isSpeakingRef.current = false;
        if (isActiveRef.current) setTimeout(startListening, 500);
      };
      await audio.play();
    } catch (e) {
      setCurrentEmotion("upset");
      isSpeakingRef.current = false;
      if (isActiveRef.current) setTimeout(startListening, 1000);
    }
  }, [startListening]);

  useEffect(() => {
    if (!unlocked) return;
    isActiveRef.current = true;
    setStatus("connecting");
    const timer = setTimeout(() => { startListening(); }, 1500);
    return () => {
      isActiveRef.current = false;
      clearTimeout(timer);
      recognitionRef.current?.stop();
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
    };
  }, [startListening, unlocked]);

  const statusConfig = {
    connecting: { label: "Menghubungkan...", color: "#c8a0ff" },
    listening: { label: "Mahiru sedang mendengarkan...", color: "#90f0a0" },
    thinking: { label: "Mahiru sedang berpikir...", color: "#ffd080" },
    speaking: { label: "Mahiru sedang berbicara...", color: "#ff9ec8" },
  };
  const sc = statusConfig[status] || statusConfig.listening;

  if (!unlocked) return (
    <div style={{
      height: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
      background: "linear-gradient(135deg, #0d0520 0%, #1a0835 60%, #0d1a35 100%)",
    }}>
      <StarBg />
      <img src={IMAGES.profile} alt="Mahiru" style={{ width: 120, height: 120, borderRadius: "50%", objectFit: "cover", border: "3px solid #ff9ec8", marginBottom: 24 }} />
      <h2 style={{ color: "#ff9ec8", fontFamily: "'Klee One', cursive", marginBottom: 8 }}>Mahiru</h2>
      <p style={{ color: "rgba(255,255,255,0.6)", fontSize: 13, marginBottom: 32 }}>Tap untuk memulai voice call</p>
      <button onClick={async () => {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        await ctx.resume();
        const buf = ctx.createBuffer(1,1,22050);
        const src = ctx.createBufferSource();
        src.buffer = buf; src.connect(ctx.destination); src.start(0);
        setUnlocked(true);
      }} style={{
        padding: "14px 40px", borderRadius: 30, border: "none",
        background: "linear-gradient(135deg, #ff9ec8, #c8a0ff)",
        color: "#fff", fontSize: 16, fontWeight: 700, cursor: "pointer",
      }}>📞 Mulai</button>
      <button onClick={onBack} style={{ marginTop: 16, background: "none", border: "none", color: "rgba(255,255,255,0.4)", cursor: "pointer" }}>Kembali</button>
    </div>
  );

  return (
    <div style={{
      height: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
      background: "linear-gradient(135deg, #0d0520 0%, #1a0835 60%, #0d1a35 100%)",
      position: "relative", overflow: "hidden",
    }}>
      <StarBg />
      <button onClick={onBack} style={{
        position: "absolute", top: 20, left: 20, zIndex: 10,
        background: "rgba(255,255,255,0.1)", border: "1px solid rgba(255,150,200,0.3)",
        color: "#fff", borderRadius: 12, padding: "8px 16px", cursor: "pointer",
        fontFamily: "'Nunito', sans-serif", fontSize: 14, fontWeight: 700,
      }}>‹ Kembali</button>

      <div style={{ position: "relative", zIndex: 2, display: "flex", flexDirection: "column", alignItems: "center" }}>
        {/* Pulse rings */}
        {status === "speaking" && <>
          <div style={{
            position: "absolute", width: 180, height: 180, borderRadius: "50%",
            border: "2px solid rgba(255,150,200,0.6)", animation: "pulse-ring 1.5s ease-out infinite",
          }} />
          <div style={{
            position: "absolute", width: 180, height: 180, borderRadius: "50%",
            border: "2px solid rgba(255,150,200,0.4)", animation: "pulse-ring2 1.5s 0.5s ease-out infinite",
          }} />
        </>}
        {status === "listening" && <>
          <div style={{
            position: "absolute", width: 180, height: 180, borderRadius: "50%",
            border: "2px solid rgba(144,240,160,0.6)", animation: "pulse-ring 2s ease-out infinite",
          }} />
        </>}

        {/* Profile circle */}
        <div style={{
          width: 160, height: 160, borderRadius: "50%", overflow: "hidden",
          border: `3px solid ${sc.color}`,
          boxShadow: `0 0 40px ${sc.color}40, 0 0 80px ${sc.color}20`,
          transition: "border-color 0.5s, box-shadow 0.5s",
          animation: "float 3s ease-in-out infinite",
          position: "relative",
        }}>
          <img src={IMAGES.profile} alt="Mahiru" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
        </div>

        <h2 style={{ fontFamily: "'Klee One', cursive", fontSize: 22, marginTop: 24, fontWeight: 600,
          background: "linear-gradient(135deg, #ff9ec8, #c8a0ff)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>
          Mahiru
        </h2>

        <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 10 }}>
          <div style={{ width: 8, height: 8, borderRadius: "50%", background: sc.color, animation: `blink 1.5s ease-in-out infinite` }} />
          <span style={{ color: sc.color, fontSize: 13, fontWeight: 600 }}>{sc.label}</span>
        </div>

        {/* Sound wave */}
        {(status === "speaking" || status === "listening") && (
          <div style={{ display: "flex", alignItems: "center", gap: 3, marginTop: 20, height: 30 }}>
            {[0,1,2,3,4,5,6].map(j => (
              <div key={j} style={{
                width: 3, background: sc.color, borderRadius: 2,
                animation: `speaking-wave ${0.6 + j * 0.1}s ${j * 0.1}s ease-in-out infinite`,
                opacity: 0.8,
              }} />
            ))}
          </div>
        )}


      </div>
    </div>
  );
}

// ====== VIDEO CALL ======
function VideoCallMode({ keys, onBack }) {
  const [status, setStatus] = useState("connecting");
  const [currentImage, setCurrentImage] = useState("1080");
  const [transcript, setTranscript] = useState("");
  const [isSpeaking, setIsSpeaking] = useState(false);
  const recognitionRef = useRef(null);
  const audioRef = useRef(null);
  const isActiveRef = useRef(true);
  const isSpeakingRef = useRef(false);
  const messages = useRef([]);

  const getLLMResponse = async (msgs) => {
    try { return await callGroq(msgs, keys.groq); }
    catch (e) {
      if (keys.gemini) { try { return await callGemini(msgs, keys.gemini); } catch {} }
      throw e;
    }
  };

  const startListening = useCallback(() => {
    if (!isActiveRef.current || isSpeakingRef.current) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    const r = new SR();
    r.lang = "id-ID";
    r.continuous = false;
    r.interimResults = true;
    r.onstart = () => { if (isActiveRef.current) setStatus("listening"); };
    r.onresult = (e) => {
      const t = Array.from(e.results).map(r => r[0].transcript).join("");
      setTranscript(t);
      if (e.results[e.results.length - 1].isFinal && t.trim()) {
        r.stop();
        handleUserSpeech(t.trim());
      }
    };
    r.onerror = () => { if (isActiveRef.current && !isSpeakingRef.current) setTimeout(startListening, 1500); };
    r.onend = () => { if (isActiveRef.current && !isSpeakingRef.current) setTimeout(startListening, 500); };
    recognitionRef.current = r;
    try { r.start(); } catch {}
  }, []);

  const handleUserSpeech = useCallback(async (text) => {
    if (!isActiveRef.current) return;
    setStatus("thinking");
    setTranscript("");
    setCurrentImage("1087");
    messages.current.push({ role: "user", content: text });
    try {
      const raw = await getLLMResponse(messages.current);
      const { text: reply, emotion } = parseResponse(raw);
      messages.current.push({ role: "assistant", content: reply });
      const imgKey = EMOTION_TO_IMAGE[emotion] || "1080";
      setCurrentImage(imgKey);
      setStatus("speaking");
      setIsSpeaking(true);
      isSpeakingRef.current = true;
      const audioUrl = await synthesizeSpeech(reply, keys.eleven);
      const audio = new Audio(audioUrl);
      audioRef.current = audio;
      audio.onended = () => {
        URL.revokeObjectURL(audioUrl);
        isSpeakingRef.current = false;
        setIsSpeaking(false);
        if (isActiveRef.current) setTimeout(startListening, 500);
      };
      audio.onerror = () => {
        isSpeakingRef.current = false;
        setIsSpeaking(false);
        if (isActiveRef.current) setTimeout(startListening, 500);
      };
      await audio.play();
    } catch (e) {
      setCurrentImage("1083");
      isSpeakingRef.current = false;
      setIsSpeaking(false);
      if (isActiveRef.current) setTimeout(startListening, 1000);
    }
  }, [startListening]);

  useEffect(() => {
    isActiveRef.current = true;
    setCurrentImage("1073");
    const timer = setTimeout(() => {
      handleUserSpeech("Halo! Mahiru sudah siap? Aku mau mulai ngobrol.");
    }, 1000);
    return () => {
      isActiveRef.current = false;
      clearTimeout(timer);
      recognitionRef.current?.stop();
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
    };
  }, []);

  const statusLabel = { connecting: "Menghubungkan...", listening: "Mendengarkan kamu...", thinking: "Sedang berpikir...", speaking: "Berbicara..." }[status] || "";
  const statusColor = { connecting: "#c8a0ff", listening: "#90f0a0", thinking: "#ffd080", speaking: "#ff9ec8" }[status] || "#fff";

  return (
    <div style={{
      width: "100vw", height: "100vh", position: "relative", overflow: "hidden",
      background: "#0d0520",
    }}>
      {/* Full screen character */}
      <div style={{
        position: "absolute", inset: 0, display: "flex", alignItems: "flex-end", justifyContent: "center",
        background: "linear-gradient(180deg, #0d0520 0%, #1a0835 40%, #150d2a 100%)",
      }}>
        <StarBg />
        <img
          key={currentImage}
          src={IMAGES[currentImage] || IMAGES["1080"]}
          alt="Mahiru"
          style={{
            height: "92vh", width: "auto", objectFit: "contain", objectPosition: "bottom",
            filter: `drop-shadow(0 0 30px rgba(255,150,200,${isSpeaking ? 0.5 : 0.2}))`,
            transition: "filter 0.5s",
            animation: "char-enter 0.4s ease-out",
            position: "relative", zIndex: 1,
          }}
        />
        {/* Gradient overlay bottom */}
        <div style={{
          position: "absolute", bottom: 0, left: 0, right: 0, height: "30vh",
          background: "linear-gradient(to top, rgba(13,5,32,0.9) 0%, transparent 100%)",
          zIndex: 2,
        }} />
      </div>

      {/* Top bar */}
      <div style={{
        position: "absolute", top: 0, left: 0, right: 0, zIndex: 10,
        padding: "16px 20px", display: "flex", alignItems: "center", justifyContent: "space-between",
        background: "linear-gradient(to bottom, rgba(13,5,32,0.8) 0%, transparent 100%)",
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ width: 10, height: 10, borderRadius: "50%", background: statusColor, animation: "blink 1.5s ease-in-out infinite" }} />
          <span style={{ color: statusColor, fontSize: 13, fontWeight: 700 }}>{statusLabel}</span>
        </div>
        <button onClick={onBack} style={{
          background: "rgba(255,50,80,0.8)", border: "none", color: "#fff",
          borderRadius: 10, padding: "8px 16px", cursor: "pointer",
          fontFamily: "'Nunito', sans-serif", fontSize: 13, fontWeight: 700,
          boxShadow: "0 4px 15px rgba(255,50,80,0.4)",
        }}>✕ End</button>
      </div>

      {/* Name plate */}
      <div style={{
        position: "absolute", bottom: 80, left: "50%", transform: "translateX(-50%)",
        zIndex: 10, textAlign: "center",
      }}>
        <h2 style={{
          fontFamily: "'Klee One', cursive", fontSize: 28, fontWeight: 600,
          background: "linear-gradient(135deg, #ff9ec8, #c8a0ff)",
          WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent",
          textShadow: "none", filter: "drop-shadow(0 2px 10px rgba(255,100,180,0.5))",
        }}>Mahiru</h2>
      </div>

      {/* Wave indicator */}
      {(status === "speaking" || status === "listening") && (
        <div style={{
          position: "absolute", bottom: 40, left: "50%", transform: "translateX(-50%)",
          zIndex: 10, display: "flex", gap: 3, alignItems: "center",
        }}>
          {[0,1,2,3,4,5,6,7,8].map(j => (
            <div key={j} style={{
              width: 3, background: statusColor, borderRadius: 2,
              animation: `speaking-wave ${0.5 + j * 0.08}s ${j * 0.08}s ease-in-out infinite`,
              opacity: 0.9,
            }} />
          ))}
        </div>
      )}

      {/* Transcript */}
      {transcript && (
        <div style={{
          position: "absolute", bottom: 120, left: "50%", transform: "translateX(-50%)",
          zIndex: 10, padding: "10px 20px", borderRadius: 20, maxWidth: "80vw",
          background: "rgba(0,0,0,0.5)", backdropFilter: "blur(10px)",
          border: "1px solid rgba(255,150,200,0.3)",
          color: "rgba(255,200,230,0.9)", fontSize: 14, textAlign: "center",
          animation: "fade-in 0.3s ease",
        }}>
          "{transcript}"
        </div>
      )}
    </div>
  );
}

// ====== APP ROOT ======
function App() {
  const [screen, setScreen] = useState("setup");
  const [keys, setKeys] = useState(null);
  const [mode, setMode] = useState(null);

  const handleSaveKeys = (k) => { setKeys(k); setScreen("menu"); };
  const handleSelectMode = (m) => { setMode(m); setScreen("mode"); };
  const handleBack = () => setScreen("menu");
  const handleReset = () => { setKeys(null); setScreen("setup"); };

  return (
    <>
      <style>{styles}</style>
      {screen === "setup" && <SetupScreen onSave={handleSaveKeys} />}
      {screen === "menu" && <MainMenu onSelect={handleSelectMode} onReset={handleReset} />}
      {screen === "mode" && mode === "chat" && <ChatMode keys={keys} onBack={handleBack} />}
      {screen === "mode" && mode === "voice" && <VoiceCallMode keys={keys} onBack={handleBack} />}
      {screen === "mode" && mode === "video" && <VideoCallMode keys={keys} onBack={handleBack} />}
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
  </script>
